name: Firebase

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Open/reopen creates the first preview. Later updates opt in with [preview] in
  # the latest commit message, so intermediate commits still run checks cheaply.
  preview-request:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      requested: ${{ steps.request.outputs.requested }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR event's default checkout is a generated merge commit; inspect
          # the author's head commit instead, without executing any PR scripts.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check preview request
        id: request
        env:
          PR_ACTION: ${{ github.event.action }}
        run: |
          message=$(git log -1 --format=%B)
          if [[ "$PR_ACTION" == "opened" || "$PR_ACTION" == "reopened" || "$message" == *"[preview]"* ]]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir functions
      - run: pnpm lint
      - run: pnpm --dir functions audit --prod
      - run: pnpm test
      - run: pnpm test:integration

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir functions
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: pnpm exec firebase deploy --project empire-ihtfy --only hosting,functions,database --non-interactive --force

  # Each pull request gets its own temporary copy of the site (a Firebase Hosting preview
  # channel) and a comment with the link. Only the site is previewed: it talks to the same
  # database and flashNames function as the live game. Reuse that preview on explicit
  # requests rather than deploying every intermediate commit.
  preview:
    needs: [check, preview-request]
    if: needs.preview-request.outputs.requested == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: empire-ihtfy
          expires: 24h
